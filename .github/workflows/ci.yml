# Esm el workflow elly hayezhar fel GitHub Actions
name: Project 2 CI

# El permissions elly el workflow me7tagha
permissions:
  contents: read
  packages: write

# Emta el workflow yeshta8al
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# El jobs elly GitHub hayenafezha
jobs:
  test:
    # El operating system elly hayeshaghal 3aleh el job
    runs-on: ubuntu-latest

    steps:
      # Step 1: Yegib el repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Yegahhez Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Step 3: Yethabet en pip version mo7addatha
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Step 4: Yethabet el project dependencies
      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt

      # Step 5: Yeshaghal el automated tests
      - name: Run tests
        run: python -m pytest tests/ -v

      # Step 6: Yebni Docker image ba3d ma el tests tenga7
      - name: Build Docker image
        run: docker build -t dockerized-application:latest ./app

      # Step 7: Y7awel esm el image le lowercase
      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Step 8: Y3mel login 3ala GitHub Container Registry
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Step 9: Y3mel tag lel image 3ashan teb2a bel esm el sa7
      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker tag dockerized-application:latest "$IMAGE_NAME:latest"

      # Step 10: Yerfa3 el image 3ala GHCR
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE_NAME:latest"